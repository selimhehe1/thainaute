# Configuration lue par l'ANALYSE AUTOMATIQUE de SonarCloud.
#
# Le nom du fichier compte : `sonar-project.properties` s'adresse à une
# analyse lancée depuis la CI, que ce dépôt n'utilise pas. L'analyse
# automatique, celle de l'application GitHub, lit `.sonarcloud.properties`
# et ignore l'autre.
#
# POURQUOI CE FICHIER EXISTE
# --------------------------
# La porte de qualité a refusé une PR pour « 12,2 % de duplication sur le
# code neuf ». Le constat était juste au sens de la mesure, et sans valeur
# au sens de la maintenance : la duplication venait d'un fichier GÉNÉRÉ,
# `embedded-audio-sources.generated.ts`, dont les soixante lignes se
# ressemblent parce que React Native exige un littéral de chaîne dans
# `require` et qu'il y a vingt-trois fichiers audio à déclarer.
#
# Personne n'édite un fichier généré, donc sa répétition ne coûte rien à
# personne. La dédupliquer à la main reviendrait à casser sa régénération.
#
# On exclut ces fichiers de la DÉTECTION DE DUPLICATION seulement. Ils
# restent analysés pour les bogues, les vulnérabilités et les mauvaises
# pratiques : un générateur peut parfaitement produire du code fautif, et
# c'est justement ce qu'on veut apprendre.
sonar.cpd.exclusions=**/*.generated.ts

# Les données de contenu et les instantanés de test ne sont pas du code.
sonar.exclusions=**/node_modules/**,**/dist/**,packages/content/data/**
