<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Votre code de connexion Thaïnaute</title>
  </head>
  <body style="margin: 0; background: #fbfaf7; color: #283450">
    <main
      style="
        max-width: 560px;
        margin: 0 auto;
        padding: 40px 24px;
        font-family: Arial, sans-serif;
      "
    >
      <p style="font-size: 14px; font-weight: 700">Thaïnaute</p>
      <h1 style="font-size: 28px">Votre code de connexion</h1>
      <p style="font-size: 16px; line-height: 1.6">
        Saisissez ce code dans l’application. Il expire dans dix minutes.
      </p>
      <p
        style="
          margin: 28px 0;
          font-size: 34px;
          font-weight: 800;
          letter-spacing: 8px;
        "
      >
        {{ .Token }}
      </p>
      <p style="font-size: 13px; line-height: 1.6; color: #667086">
        Si vous n’avez pas demandé ce code, ignorez simplement cet email. Ne le
        transférez à personne.
      </p>
    </main>
  </body>
</html>
