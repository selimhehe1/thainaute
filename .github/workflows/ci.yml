name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      THAINAUTE_PUBLIC_INDEXING: disabled
      THAINAUTE_PUBLIC_URL: http://localhost:3000/
      THAINAUTE_RELEASE: ci
      THAINAUTE_SYNC_MODE: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:validate
      - run: pnpm content:audit
      - run: pnpm build

  e2e-web:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      THAINAUTE_PUBLIC_INDEXING: disabled
      THAINAUTE_PUBLIC_URL: http://localhost:3000/
      THAINAUTE_RELEASE: ci
      THAINAUTE_SYNC_MODE: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thainaute/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:web

  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install locked dependencies with allowlisted build scripts
        run: pnpm install --frozen-lockfile # NOSONAR -- allowBuilds in pnpm-workspace.yaml is explicit.
      - run: pnpm --filter @thainaute/mobile run config:check
      - run: pnpm --filter @thainaute/mobile run native:check
      - run: pnpm --filter @thainaute/mobile exec expo prebuild --clean --no-install --platform android
      - name: Compile Android debug app for the representative arm64 ABI
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a
        working-directory: apps/mobile/android

  native-ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select Xcode 26.4
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
          xcodebuild -version
      - name: Install locked dependencies with allowlisted build scripts
        run: pnpm install --frozen-lockfile # NOSONAR -- allowBuilds in pnpm-workspace.yaml is explicit.
      - run: pnpm --filter @thainaute/mobile run config:check
      - run: pnpm --filter @thainaute/mobile run native:check
      - run: pnpm --filter @thainaute/mobile exec expo prebuild --clean --platform ios
      - name: Compile the iOS simulator app
        run: |
          shopt -s nullglob
          workspaces=(apps/mobile/ios/*.xcworkspace)
          if [[ ${#workspaces[@]} -ne 1 ]]; then
            echo "Expected exactly one generated iOS workspace, found ${#workspaces[@]}." >&2
            exit 1
          fi
          workspace="${workspaces[0]}"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase without logging generated keys
        run: pnpm exec supabase start --log-level error > /dev/null
      - run: pnpm db:reset
      - run: pnpm db:test
      - run: pnpm db:lint
      - name: Block security advisor warnings
        run: pnpm db:advisors:security
      - name: Report performance advisor findings
        run: pnpm db:advisors:performance
      - name: Load connected sync fixture
        run: pnpm exec supabase db query --local --file supabase/fixtures/connected_sync.sql
      - name: Install Chromium for the connected sync test
        run: pnpm --filter @thainaute/web exec playwright install --with-deps chromium
      - name: Run connected account sync end to end
        env:
          CI: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          THAINAUTE_PUBLIC_INDEXING: disabled
          THAINAUTE_PUBLIC_URL: http://localhost:3000/
          THAINAUTE_RELEASE: ci-connected
          THAINAUTE_SYNC_MODE: supabase
          THAINAUTE_PUBLIC_CONTENT_RELEASE_ID: 30000000-0000-4000-8000-000000000001
          ACCOUNT_DELETION_RECEIPT_PEPPER: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        run: |
          set -euo pipefail
          supabase_env="$(
            pnpm exec supabase status -o env \
              --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
              --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
              --override-name auth.service_role_key=SUPABASE_SECRET_KEY |
              grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|SUPABASE_SECRET_KEY)='
          )"
          for required_name in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SECRET_KEY
          do
            if ! grep -q "^${required_name}=" <<< "${supabase_env}"; then
              echo "Missing required local Supabase variable: ${required_name}." >&2
              exit 1
            fi
          done
          set -a
          source /dev/stdin <<< "${supabase_env}"
          set +a
          unset supabase_env
          pnpm --filter @thainaute/web exec playwright test e2e/connected-sync.spec.ts \
            --project=chromium --workers=1 --retries=0 --trace=off
          THAINAUTE_LOCAL_FIXTURE_BOOTSTRAP=1 \
            pnpm fixture:bootstrap-local-audio
          THAINAUTE_PUBLIC_CONTENT_MODE=supabase \
            pnpm --filter @thainaute/web exec playwright test \
              e2e/connected-learning-ui.spec.ts \
              --project=chromium --workers=1 --retries=0 --trace=off
          THAINAUTE_CONTENT_REPORT_MODE=supabase \
            pnpm --filter @thainaute/web exec playwright test \
              e2e/connected-content-report.spec.ts \
              --project=chromium --workers=1 --retries=0 --trace=off
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
