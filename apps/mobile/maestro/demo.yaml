- tapOn: "Commencer la démo locale"
- assertVisible: "Donnée fictive — non publiable"
- assertVisible: "ก่"
- tapOn: "Commencer"
- tapOn: "Option A"
- waitForAnimationToEnd:
    timeout: 1000
- stopApp
- launchApp
- assertVisible: "Reprendre l’exercice"
- tapOn: "Reprendre l’exercice"
- assertVisible: "Option A"
- tapOn: "Valider"
- assertVisible: "La boucle technique fonctionne."
- assertVisible: "250 ‰"
- tapOn: "M’enregistrer sur cet appareil"
- assertVisible: "Arrêter mon enregistrement,.*"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn: "Arrêter mon enregistrement,.*"
